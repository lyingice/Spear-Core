modLoader="javafml"
loaderVersion="[4,)"
license="MIT License"

[[mods]]
modId="spearcore"
version="3.0.0"
displayName="Spear Core"
displayURL="https://center.mcmod.cn/863182/"
logoFile="spear.png"
credits="Lyingice's Spear Core"
authors="Lyingice"

# Start of user code block mod configuration
# End of user code block mod configuration

[[mixins]]
    config = "spearcore.mixins.json"

# Start of user code block custom mixins
# Punchy（可选依赖）阶段的软桥接：未安装 Punchy 时由插件判定跳过，配置 required=false 不会因目标缺失而崩
[[mixins]]
    config = "spearcore.punchy.mixins.json"
# End of user code block custom mixins

[[dependencies.spearcore]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.190,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.spearcore]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="AFTER"
    side="BOTH"




# Start of user code block dependencies configuration
[[dependencies.spearcore]]
    modId="punchy"
    type="optional"
    versionRange="[2.6.2,)"
    ordering="AFTER"
    side="CLIENT"

# KubeJS 联动为可选依赖：插件类只通过 kubejs.plugins.txt 字符串反射加载，
# 未安装 KubeJS 时不会加载任何相关类，mod 行为与不加该依赖时完全一致。
[[dependencies.spearcore]]
    modId="kubejs"
    type="optional"
    versionRange="[2101,)"
    ordering="AFTER"
    side="BOTH"
# End of user code block dependencies configuration
