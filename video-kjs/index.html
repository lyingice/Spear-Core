<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Spear Core · KubeJS 教程</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #090d12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d12;
      }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1100px 640px at 50% 40%, rgba(127, 227, 242, 0.06), rgba(0, 0, 0, 0) 72%),
          radial-gradient(900px 900px at 8% 92%, rgba(38, 92, 122, 0.12), rgba(0, 0, 0, 0) 72%),
          linear-gradient(180deg, #0a1017 0%, #090d12 56%, #070a0e 100%);
      }
      #grid {
        position: absolute;
        inset: 0;
        opacity: 0.4;
        background-image:
          linear-gradient(to right, rgba(127, 227, 242, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(127, 227, 242, 0.06) 1px, transparent 1px);
        background-size: 80px 80px;
        -webkit-mask-image: radial-gradient(1020px 720px at 50% 50%, #000 18%, transparent 76%);
        mask-image: radial-gradient(1020px 720px at 50% 50%, #000 18%, transparent 76%);
      }
      #root > [data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9.8"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="grid"></div>

      <div
        id="host-a"
        data-composition-id="scene-a"
        data-composition-src="compositions/scene-a.html"
        data-start="0"
        data-duration="1.4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="host-b"
        data-composition-id="scene-b"
        data-composition-src="compositions/scene-b.html"
        data-start="1.3"
        data-duration="5.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="host-c"
        data-composition-id="scene-c"
        data-composition-src="compositions/scene-c.html"
        data-start="6.4"
        data-duration="2.2"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="host-d"
        data-composition-id="scene-d"
        data-composition-src="compositions/scene-d.html"
        data-start="8.45"
        data-duration="1.35"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__timelines["main"].seek(0);
    </script>
  </body>
</html>
