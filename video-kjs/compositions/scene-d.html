<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>scene-d</title>
  </head>
  <body>
    <template>
      <style>
      @font-face {
        font-family: "SC Sans";
        src: url("assets/fonts/NotoSansSC-VF.ttf");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Mono Code";
        src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Mono Code";
        src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        color: #e6edf5;
        font-family: "SC Sans", sans-serif;
      }
      .px { image-rendering: pixelated; image-rendering: crisp-edges; }
      .reveal { display: block; overflow: hidden; }
        #d-bg {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 768px;
          height: 768px;
          margin-left: -384px;
          margin-top: -384px;
          opacity: 0;
          filter: grayscale(1) brightness(0) invert(1);
        }
        .stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        #d-title {
          font-size: 96px;
          line-height: 1.2;
          font-weight: 800;
          letter-spacing: 0.01em;
          color: #f2f7fc;
        }
        #d-sub {
          margin-top: 30px;
          font-size: 38px;
          letter-spacing: 0.08em;
          color: #8a9aac;
        }
      </style>
      <div id="root" data-composition-id="scene-d" data-width="1920" data-height="1080">
        <img id="d-bg" class="px" src="assets/items/kjs_spear_in_hand.png" alt="" />
        <div class="stage">
          <div class="reveal" data-layout-allow-overflow><h2 id="d-title" data-layout-allow-overflow>Spear Core · KubeJS 教程</h2></div>
          <p id="d-sub">kjs-guide.md · 不需要写 Java</p>
        </div>
      </div>
      <script>
        (function () {
          "use strict";
          gsap.set("#d-bg", { opacity: 0, scale: 1.06 });
          gsap.set("#d-title", { yPercent: 118 });
          gsap.set("#d-sub", { opacity: 0, y: 18 });

          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#d-bg", { opacity: 0, scale: 1.06 }, { opacity: 0.1, scale: 1, duration: 0.9, ease: "power2.out" }, 0);
          tl.fromTo("#d-title", { yPercent: 118 }, { yPercent: 0, duration: 0.52, ease: "power3.out" }, 0.1);
          tl.fromTo("#d-sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.27);

          window.__timelines["scene-d"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
