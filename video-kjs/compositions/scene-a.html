<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>scene-a</title>
  </head>
  <body>
    <template>
      <style>
      @font-face {
        font-family: "SC Sans";
        src: url("assets/fonts/NotoSansSC-VF.ttf");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Mono Code";
        src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Mono Code";
        src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        color: #e6edf5;
        font-family: "SC Sans", sans-serif;
      }
      .px { image-rendering: pixelated; image-rendering: crisp-edges; }
      .reveal { display: block; overflow: hidden; }
        #root {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #spear-row {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 116px;
          height: 64px;
        }
        #spear-row img {
          position: absolute;
          top: 0;
          width: 64px;
          height: 64px;
          filter: grayscale(1) brightness(2);
          opacity: 0;
        }
        .title-block { position: relative; margin-top: -44px; text-align: center; }
        #a-title {
          font-size: 112px;
          line-height: 1.16;
          font-weight: 800;
          letter-spacing: 0.01em;
          color: #f2f7fc;
        }
        #a-rule {
          width: 240px;
          height: 6px;
          margin: 30px auto 0;
          border-radius: 3px;
          background: #7fe3f2;
          box-shadow: 0 0 28px rgba(127, 227, 242, 0.55);
        }
        #a-sub {
          margin-top: 28px;
          font-size: 40px;
          letter-spacing: 0.12em;
          color: #8a9aac;
        }
      </style>
      <div id="root" data-composition-id="scene-a" data-width="1920" data-height="1080">
        <div class="stage">
          <div id="spear-row">
        <img class="px" src="assets/items/mod/wooden_spear.png" alt="" style="left:376px" />
        <img class="px" src="assets/items/mod/stone_spear.png" alt="" style="left:560px" />
        <img class="px" src="assets/items/mod/copper_spear.png" alt="" style="left:744px" />
        <img class="px" src="assets/items/mod/iron_spear.png" alt="" style="left:928px" />
        <img class="px" src="assets/items/mod/golden_spear.png" alt="" style="left:1112px" />
        <img class="px" src="assets/items/mod/diamond_spear.png" alt="" style="left:1296px" />
        <img class="px" src="assets/items/mod/netherite_spear.png" alt="" style="left:1480px" />
          </div>
          <div class="title-block">
            <div class="reveal" data-layout-allow-overflow><h1 id="a-title" data-layout-allow-overflow>用 KubeJS 加一把矛</h1></div>
            <div id="a-rule"></div>
            <p id="a-sub">Spear Core · 5 行代码</p>
          </div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";
          gsap.set(".stage", { opacity: 0 });
          gsap.set("#a-title", { yPercent: 118 });
          gsap.set("#a-rule", { scaleX: 0 });
          gsap.set("#a-sub", { opacity: 0, y: 18 });

          var tl = gsap.timeline({ paused: true });
          tl.fromTo(".stage", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
          tl.fromTo("#spear-row img", { opacity: 0 }, { opacity: 0.18, duration: 0.55, ease: "power2.out", stagger: 0.045 }, 0.05);
          tl.fromTo("#a-title", { yPercent: 118 }, { yPercent: 0, duration: 0.66, ease: "power3.out" }, 0.1);
          tl.fromTo("#a-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.42);
          tl.fromTo("#a-sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.5);
          tl.to(".stage", { opacity: 0, duration: 0.28, ease: "power2.in" }, 1.06);

          window.__timelines["scene-a"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
